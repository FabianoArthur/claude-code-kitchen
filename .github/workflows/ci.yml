name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repo, issues or packages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} — pytest, selftests, ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install tmux and zsh (the dispatcher and guard tests use them)
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux zsh
      - name: Install pinned dev tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: pytest (includes every script's --selftest)
        run: python -m pytest -v
      - name: ruff
        run: ruff check .

  shell:
    name: Shell — shellcheck, zsh syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: shellcheck
        run: shellcheck --version && shellcheck install.sh
      - name: zsh -n
        run: zsh -n shell/zshrc-guard.zsh

  docs:
    name: Docs — markdownlint, relative links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LYCHEE_VERSION: "0.24.2"
      LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"
      - name: Install lychee (checksum-verified)
        run: |
          curl -sSfL -o lychee.tgz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tgz" | sha256sum -c -
          tar xzf lychee.tgz
          install -m 0755 lychee-x86_64-unknown-linux-gnu/lychee "$RUNNER_TEMP/lychee"
          rm -rf lychee.tgz lychee-x86_64-unknown-linux-gnu
      - name: lychee (offline — relative links and anchors only)
        run: '"$RUNNER_TEMP/lychee" --offline --no-progress --config lychee.toml "./**/*.md"'

  secrets:
    name: Secret scan — gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # scan the whole history, not only the last commit
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
          rm -f gitleaks.tgz gitleaks
      - name: gitleaks — git history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1'
      - name: gitleaks — working tree
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --exit-code 1'
      - name: Commit e-mails are GitHub noreply addresses (PR commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A public repo publishes every author/committer e-mail. Only noreply identities pass.
          bad=$(git log --format='%ae%n%ce' "$BASE_SHA..$HEAD_SHA" | sort -u \
                | grep -vE '(@users\.noreply\.github\.com|^noreply@github\.com)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::$(printf '%s\n' "$bad" | wc -l | tr -d ' ') commit e-mail(s) are not GitHub noreply addresses"
            exit 1
          fi
          echo "all commit e-mails in the PR are noreply"
